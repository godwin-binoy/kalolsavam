<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Stage Control · Kalolsavam</title>
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/dashboard/css/dashboard.css">
</head>
<body class="login-body" data-portal="stagemaster">
<div id="app" class="hidden">
  <main>
    <div id="boards" class="grid"></div>
    <section id="photo-intake" class="panel" style="margin-top:2rem;display:none">
      <h2>Photo Intake</h2>
      <p class="muted small">Upload stage photos (max 10 MB per image). You can remove individual photos before uploading.</p>
      <div class="row" style="margin-bottom:1rem">
        <label style="margin:0;display:flex;align-items:center;gap:.5rem">Stage: <select id="photo-venue-select" style="width:auto;margin:0"></select></label>
      </div>
      <div class="split">
        <div class="panel">
          <h3>Workflow 1 (Bulk)</h3>
          <p class="small muted">Upload slip photos + raw stage photos for Data Workers to assign.</p>
          <label>Slip Photos<input type="file" id="w1-slips" multiple accept="image/jpeg,image/png,image/webp"></label>
          <div id="w1-slips-preview" class="photo-preview-grid"></div>
          <label>Stage Photos<input type="file" id="w1-stage" multiple accept="image/jpeg,image/png,image/webp"></label>
          <div id="w1-stage-preview" class="photo-preview-grid"></div>
          <button class="primary" type="button" id="w1-submit" style="margin-top:.5rem">Queue for Data Worker</button>
        </div>
        <div class="panel">
          <h3>Workflow 2 (Quick)</h3>
          <p class="small muted">Select item and any register number(s), preview photos, then upload &amp; publish.</p>
          <label>Select Item<select id="w2-item"></select></label>
          <input id="w2-item-custom" placeholder="Enter item code (e.g. 101)" maxlength="32" style="margin-top:.4rem;display:none">
          <label>Register Number(s)<div class="row"><input id="w2-reg-search" placeholder="Search reg no or name…" autocomplete="off" style="flex:1"><button type="button" id="w2-reg-add" class="small">+ Add Reg #</button></div></label>
          <div id="w2-reg-suggestions" style="margin-top:.35rem"></div>
          <div id="w2-reg-chips" class="chip-list"></div>
          <label>Stage Photos<input type="file" id="w2-stage" multiple accept="image/jpeg,image/png,image/webp"></label>
          <div id="w2-stage-preview" class="photo-preview-grid"></div>
          <button class="primary" type="button" id="w2-submit" style="margin-top:.5rem">Upload &amp; Publish</button>
        </div>
      </div>
    </section>
  </main>
</div>
<script src="/config.js"></script>
<script src="/assets/js/common.js"></script>
<script src="/dashboard/js/api.js"></script>
<script src="/dashboard/js/auth.js"></script>
<script src="/dashboard/js/board.js"></script>
</body>
</html>
