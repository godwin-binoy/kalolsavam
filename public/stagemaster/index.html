<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Stage Control · Kalolsavam</title>
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/dashboard/css/dashboard.css">
</head>
<body class="login-body">
<main class="login-card">
  <h1 class="brand">Kalolsavam <span>Stage Control</span></h1>
  <p class="muted small">Staff sign-in. Only assigned stages are accessible.</p>
  <form id="login-form" autocomplete="off">
    <label>Email<input id="email" type="email" required maxlength="120" autocomplete="email"></label>
    <label>Password<input id="password" type="password" required autocomplete="current-password"></label>
    <button type="submit" id="login-btn">Sign in</button>
    <p id="login-msg" class="msg" role="status" aria-live="polite"></p>
  </form>
</main>
<div id="app" class="hidden">
  <header class="topbar">
    <h1 class="brand">Kalolsavam <span>Stage Control</span></h1>
    <span id="who" class="badge"></span>
    <span id="conn" class="badge">connecting…</span>
    <span class="spacer"></span>
    <button id="change-pass-btn" class="small">🔑 Password</button>
    <button id="sync-btn">↻ Sync</button>
    <button id="logout-btn">Sign out</button>
  </header>
  <main>
    <div id="boards" class="grid"></div>
  </main>
</div>

<dialog id="score-dialog">
  <h3>Enter score</h3>
  <p class="muted small" id="score-who"></p>
  <form method="dialog" id="score-form">
    <label>Judge number<select id="score-judge"></select></label>
    <label>Score<input id="score-value" type="number" min="0" max="100" step="0.01" required></label>
    <div class="row" style="margin-top:.9rem">
      <button value="save" class="primary" type="submit">Save</button>
      <button value="cancel" type="button" data-cancel-score>Cancel</button>
    </div>
  </form>
</dialog>

<dialog id="self-password-dialog">
  <h3 style="margin-top:0">Change My Password</h3>
  <form id="self-password-form">
    <label>Current password<input id="self-old-pass" type="password" required autocomplete="current-password"></label>
    <label>New password (12+ characters)<input id="self-new-pass" type="password" minlength="12" required autocomplete="new-password"></label>
    <div class="row" style="margin-top:.9rem">
      <button class="primary" type="submit">Update Password</button>
      <button type="button" data-cancel-self-pass>Cancel</button>
    </div>
  </form>
</dialog>

<script>window.KAL_API_BASE = "";</script>
<script src="/dashboard/js/api.js"></script>
<script src="/dashboard/js/auth.js"></script>
<script src="/dashboard/js/ui.js"></script>
<script src="/dashboard/js/board.js"></script>
</body>
</html>
