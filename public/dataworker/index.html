<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Data Worker · Kalolsavam</title>
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/dashboard/css/dashboard.css">
</head>
<body class="login-body">
<main class="login-card">
  <h1 class="brand">Kalolsavam <span>Data Worker</span></h1>
  <p class="muted small">Match slip photos to participants and publish stage photos.</p>
  <form id="login-form" autocomplete="off">
    <label>Email<input id="email" type="email" required autocomplete="email"></label>
    <label>Password<input id="password" type="password" required autocomplete="current-password"></label>
    <button type="submit" id="login-btn">Sign in</button>
    <p id="login-msg" class="msg" role="status" aria-live="polite"></p>
  </form>
</main>
<div id="app" class="hidden">
  <header class="topbar">
    <h1 class="brand">Kalolsavam <span>Data Worker</span></h1>
    <span id="who" class="badge"></span>
    <span class="spacer"></span>
    <button id="theme" title="Toggle dark mode" style="margin-right:.5rem">🌓 Theme</button>
    <button id="change-pass-btn" class="small">🔑 Password</button>
    <button id="refresh-batches-btn">↻ Refresh</button>
    <button id="logout-btn">Sign out</button>
  </header>
  <main>
    <div id="batches-view" class="grid"></div>
    <div id="batch-detail-view" class="hidden" style="margin-top:1rem">
      <button id="back-to-batches" class="btn-link">&larr; Back to Queue</button>
      <div id="batch-content" style="margin-top:1rem"></div>
    </div>
  </main>
</div>

<dialog id="self-password-dialog">
  <h3 style="margin-top:0">Change My Password</h3>
  <form id="self-password-form">
    <label>Current password<input id="self-old-pass" type="password" required autocomplete="current-password"></label>
    <label>New password (12+ characters)<input id="self-new-pass" type="password" minlength="12" required autocomplete="new-password"></label>
    <div class="row" style="margin-top:.9rem">
      <button class="primary" type="submit">Update Password</button>
      <button type="button" data-cancel-self-pass>Cancel</button>
    </div>
  </form>
</dialog>

<script src="/config.js"></script>
<script src="/dashboard/js/api.js"></script>
<script src="/dashboard/js/auth.js"></script>
<script src="/dashboard/js/ui.js"></script>
<script src="/dashboard/js/dataworker.js"></script>
</body>
</html>
