<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin Console · Kalolsavam</title>
<link rel="stylesheet" href="/dashboard/css/dashboard.css">
</head>
<body class="login-body">
<main class="login-card">
  <h1 class="brand">Kalolsavam <span>Admin Console</span></h1>
  <p class="muted small">Master data, staff accounts, and operations.</p>
  <form id="login-form" autocomplete="off">
    <label>Email<input id="email" type="email" required maxlength="120" autocomplete="email"></label>
    <label>Password<input id="password" type="password" required autocomplete="current-password"></label>
    <button type="submit" id="login-btn">Sign in</button>
    <p id="login-msg" class="msg" role="status" aria-live="polite"></p>
  </form>
</main>
<div id="app" class="hidden">
  <header class="topbar">
    <h1 class="brand">Kalolsavam <span>Admin</span></h1>
    <span id="who" class="badge"></span>
    <span class="spacer"></span>
    <button id="logout-btn">Sign out</button>
  </header>
  <main>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="venues">Venues</button>
      <button class="tab" data-tab="events">Events</button>
      <button class="tab" data-tab="queue">Queue</button>
      <button class="tab" data-tab="users">Users</button>
      <button class="tab" data-tab="ops">Ops</button>
    </nav>
    <section id="view"></section>
  </main>
</div>
<script src="/dashboard/js/api.js"></script>
<script src="/dashboard/js/auth.js"></script>
<script src="/dashboard/js/admin.js"></script>
</body>
</html>
