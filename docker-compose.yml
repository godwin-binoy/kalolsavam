services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: kalolsavam-backend:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./deployment:/app/deployment:Z
    environment:
      PYTHONUNBUFFERED: "1"
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8000"
      DB_PATH: "/app/deployment/kalolsavam.db"
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-https://mala-subdistrict-kalolsavam.pages.dev}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      SECRET_KEY: "${SECRET_KEY:-}"
      TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-true}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [backend]
    profiles: ["tunnel"]

  photos:
    build:
      context: .
      dockerfile: Dockerfile.photos
    image: kalolsavam-photos:latest
    restart: unless-stopped
    profiles: ["photos"]
    volumes:
      - ./deployment/photos_archive:/app/archive:Z
    environment:
      CORE_URL: "${CORE_URL:-http://backend:8000}"
      SECRET_KEY: "${SECRET_KEY:-}"
      ARCHIVE_ORIGINALS: "${ARCHIVE_ORIGINALS:-false}"

  obs:
    build:
      context: .
      dockerfile: Dockerfile.obs
    image: kalolsavam-obs:latest
    restart: unless-stopped
    profiles: ["obs"]
    volumes:
      - ./deployment/obs_backups:/app/backups:Z
    environment:
      CORE_URL: "${CORE_URL:-http://backend:8000}"
      SECRET_KEY: "${SECRET_KEY:-}"
