services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: kalolsavam-backend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./deployment:/app/deployment:Z
    environment:
      PYTHONUNBUFFERED: "1"
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8000"
      DB_PATH: "/app/deployment/kalolsavam.db"
      # PUBLIC_ORIGIN is the FRONTEND origin (Pages URL / custom domain).
      # Empty -> Settings._valid_origin raises at startup (fail loud).
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      SECRET_KEY: "${SECRET_KEY:-}"
      SESSION_TTL_MIN: "${SESSION_TTL_MIN:-480}"
      TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-true}"
      RESULTS_URL: "${RESULTS_URL:-https://kalolsavam.kerala.gov.in/}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@kalolsavam.example.com}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Cloudflare Tunnel sidecar. Only starts with `--profile tunnel` (or
  # `./kal up --tunnel`). Configure once in the Cloudflare dashboard:
  #   Zero Trust > Networks > Tunnels > <your tunnel> > Public Hostname
  #     hostname: apikalolsavammala.dpdns.org
  #     service:  http://backend:8000
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - tunnel
