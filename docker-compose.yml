services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: kalolsavam-backend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./deployment:/app/deployment:Z
    environment:
      PYTHONUNBUFFERED: "1"
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8000"
      DB_PATH: "/app/deployment/kalolsavam.db"
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      SECRET_KEY: "${SECRET_KEY:-}"
      SESSION_TTL_MIN: "${SESSION_TTL_MIN:-480}"
      TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-true}"
      RESULTS_URL: "${RESULTS_URL:-https://kalolsavam.kerala.gov.in/}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@kalolsavam.example.com}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"

  photos:
    build:
      context: .
      dockerfile: Dockerfile.photos
    image: kalolsavam-photos:latest
    restart: unless-stopped
    volumes:
      - ./deployment/photos:/app/photos_data:Z
    environment:
      SECRET_KEY: "${SECRET_KEY:-}"
      PHOTOS_DB_PATH: "sqlite:////app/photos_data/photos.db"

  obs:
    build:
      context: .
      dockerfile: Dockerfile.obs
    image: kalolsavam-obs:latest
    restart: unless-stopped
    volumes:
      - ./deployment/obs_backups:/app/backups:Z
    environment:
      SECRET_KEY: "${SECRET_KEY:-}"
      CORE_URL: "http://backend:8000"

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    volumes:
      - ./deployment/cloudflared:/etc/cloudflared:Z
    depends_on:
      - backend
      - photos
      - obs
    profiles:
      - tunnel
