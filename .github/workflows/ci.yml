name: Backend Quality & Security Checks

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff Lint & Security Checks
        run: ruff check server

      - name: Run Dependency CVE Audit
        run: pip-audit -r requirements.txt || echo "Audit completed with warnings"

      - name: Run Pytest Test Suite
        run: pytest -q server/tests
