name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test-backend:
    # Match only runners that carry the "kalolsavam" label so a CI runner
    # for another project can't grab this job by accident.
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true              # wipe untracked files from previous runs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip               # stored under $HOME, survives workspace clean

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Run tests
        run: pytest -q --disable-warnings --maxfail=1

  build-and-deploy:
    needs: test-backend
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Astro site
        run: npm run build
        env:
          # Repo → Settings → Variables → Actions → API_BASE_URL
          PUBLIC_API_BASE: ${{ vars.API_BASE_URL }}

      - name: Remove backend-only panels from the public deploy
        run: rm -rf dist/admin dist/stagemaster

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          user_name: "kalolsavam-bot"
          user_email: "bot@kalolsavam.local"
          commit_message: "deploy: ${{ github.sha }}"
          enable_jekyll: false
