name: Deploy Kalolsavam

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "deploy-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  # ── 1. Frontend: Build & Deploy to GitHub Pages ──────────────────────
  build-and-deploy-frontend:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install, build, and upload Astro site
        uses: withastro/action@v6
        with:
          path: .
          node-version: 22
          package-manager: npm@latest
          # build-cmd: npm run build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # ── 2. Backend: Run tests ─────────────────────────────────────────────
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run backend tests
        run: pytest -q --disable-warnings --maxfail=1

  # ── 3. Backend: Trigger deployment (Render / Railway / etc.) ─────────
  deploy-backend:
    needs: test-backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backend deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "⚠️ DEPLOY_HOOK_URL secret not set. Skipping backend deploy."
            exit 0
          fi
          echo "🚀 Triggering backend deployment…"
          curl -fsSL -X POST "$DEPLOY_HOOK_URL"
          echo "✅ Backend deployment triggered."
