name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund || npm install --prefer-offline --no-audit --no-fund

      - name: Determine deployment base path
        id: base
        run: |
          if [ -f public/CNAME ]; then
            DOMAIN=$(cat public/CNAME | tr -d '[:space:]')
            echo "path=/" >> "$GITHUB_OUTPUT"
            echo "site=https://${DOMAIN}" >> "$GITHUB_OUTPUT"
            echo "Detected CNAME → ${DOMAIN} (root base path)"
          else
            REPO_NAME="${GITHUB_REPOSITORY#*/}"
            echo "path=/${REPO_NAME}/" >> "$GITHUB_OUTPUT"
            echo "site=https://${GITHUB_REPOSITORY_OWNER}.github.io" >> "$GITHUB_OUTPUT"
            echo "No CNAME → subpath /${REPO_NAME}/"
          fi

      - name: Build site
        run: npm run build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
          SITE_URL: ${{ steps.base.outputs.site }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
