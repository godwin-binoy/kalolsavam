name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test-backend:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      # Pick the best Python available: prefer 3.13 → 3.12 → 3.11 → 3.15
      # (3.15 is last because several deps don't yet ship wheels for it).
      - name: Resolve Python interpreter
        id: py
        run: |
          for v in python3.13 python3.12 python3.11 python3.15 python3; do
            if command -v "$v" >/dev/null 2>&1; then
              echo "interpreter=$(command -v "$v")" >> "$GITHUB_OUTPUT"
              echo "Using $v ($($v --version 2>&1))"
              exit 0
            fi
          done
          echo "No python3 found on runner" >&2
          exit 1

      - name: Install dependencies (isolated venv, PEP 668 safe)
        run: |
          ${{ steps.py.outputs.interpreter }} -m venv .venv-ci
          .venv-ci/bin/python -m pip install --upgrade pip wheel
          .venv-ci/bin/pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Run tests
        run: .venv-ci/bin/pytest -q --disable-warnings --maxfail=1

  build-and-deploy:
    needs: test-backend
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Astro site
        run: npm run build
        env:
          PUBLIC_API_BASE: ${{ vars.API_BASE_URL }}

      - name: Remove backend-only panels from public deploy
        run: rm -rf dist/admin dist/stagemaster

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          user_name: "kalolsavam-bot"
          user_email: "bot@kalolsavam.local"
          commit_message: "deploy: ${{ github.sha }}"
          enable_jekyll: false
